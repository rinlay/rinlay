name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/rinlay/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if already published
        id: check
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RINLAY_SKIP=false
          CREATE_RINLAY_SKIP=false

          if npm view "rinlay@${VERSION}" version >/dev/null 2>&1; then
            RINLAY_SKIP=true
            echo "rinlay@${VERSION} already published, skip"
          else
            echo "rinlay@${VERSION} not published, will publish"
          fi

          if npm view "create-rinlay@${VERSION}" version >/dev/null 2>&1; then
            CREATE_RINLAY_SKIP=true
            echo "create-rinlay@${VERSION} already published, skip"
          else
            echo "create-rinlay@${VERSION} not published, will publish"
          fi

          echo "rinlay_skip=${RINLAY_SKIP}" >> "$GITHUB_OUTPUT"
          echo "create_rinlay_skip=${CREATE_RINLAY_SKIP}" >> "$GITHUB_OUTPUT"

          if [ "$RINLAY_SKIP" = "true" ] && [ "$CREATE_RINLAY_SKIP" = "true" ]; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.needs_publish == 'true'

      - name: Build
        if: steps.check.outputs.needs_publish == 'true'
        run: pnpm exec tsc -b packages/rinlay packages/create-rinlay

      - name: Publish rinlay
        if: steps.check.outputs.rinlay_skip != 'true'
        working-directory: packages/rinlay
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          pnpm publish --access public --no-git-checks

      - name: Publish create-rinlay
        if: steps.check.outputs.create_rinlay_skip != 'true'
        working-directory: packages/create-rinlay
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          pnpm publish --access public --no-git-checks

      - name: Create GitHub Release
        if: steps.check.outputs.needs_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)

          {
            echo "## Packages"
            echo
            echo "- \`rinlay@${VERSION}\` — [npm](https://www.npmjs.com/package/rinlay/v/${VERSION})"
            echo "- \`create-rinlay@${VERSION}\` — [npm](https://www.npmjs.com/package/create-rinlay/v/${VERSION})"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "pnpm create rinlay my-app"
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi
          } > release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, skip tagging"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skip"
          else
            gh release create "$TAG" --title "v${VERSION}" --notes-file release-notes.md
          fi
