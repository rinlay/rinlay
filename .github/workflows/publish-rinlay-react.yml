name: Publish rinlay-react

on:
  push:
    branches: [main]
    paths:
      - 'packages/rinlay-react/**'
      - '.github/workflows/publish-rinlay-react.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc -b packages/rinlay-react

      - name: Publish
        working-directory: packages/rinlay-react
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
